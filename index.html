<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Styling khusus untuk struk */
        .receipt-paper {
            background-color: white;
            width: 380px;
            min-height: 500px;
            padding: 40px 30px;
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: 15px;
            color: #000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }

        .receipt-paper .title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .receipt-paper .center {
            text-align: center;
        }

        .receipt-paper .divider {
            border-bottom: 1px solid #000;
            margin: 20px 0;
        }

        .receipt-paper .flex-between {
            display: flex;
            justify-content: space-between;
        }

        /* Menyembunyikan elemen UI saat dicetak (Print) */
        @media print {
            body * {
                visibility: hidden;
                background-color: white !important;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
                box-shadow: none;
            }
        }

        /* Styling form iOS style */
        .ios-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .ios-input:focus {
            border-color: #3b82f6;
        }
        .ios-label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }
        .section-title {
            color: #2563eb;
            font-size: 18px;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- BAGIAN KIRI: Form Input -->
    <div class="w-full md:w-1/2 lg:w-5/12 h-full bg-gray-50 flex flex-col border-r border-gray-200">
        <!-- Header iOS Style -->
        <div class="bg-white px-4 py-3 border-b flex justify-between items-center sticky top-0 z-10">
            <div class="text-blue-500 font-semibold cursor-pointer">&lt; Back</div>
            <div class="font-bold text-lg">Receipt</div>
            <button onclick="window.print()" class="text-blue-500 font-semibold cursor-pointer hover:text-blue-700">Print / Save</button>
        </div>

        <!-- Form Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-24">
            
            <!-- Meta Data -->
            <div class="space-y-4">
                <div>
                    <label class="ios-label">Receipt ID</label>
                    <input type="text" id="in-id" class="ios-input" value="TNR00121" oninput="updateReceipt()">
                </div>
                <div class="flex space-x-3">
                    <div class="w-1/2">
                        <label class="ios-label">Date</label>
                        <input type="text" id="in-date" class="ios-input" value="20 Aug 2026" oninput="updateReceipt()">
                    </div>
                    <div class="w-1/2">
                        <label class="ios-label">Time</label>
                        <input type="text" id="in-time" class="ios-input" value="7:32 pm" oninput="updateReceipt()">
                    </div>
                </div>
            </div>

            <!-- Business Section -->
            <div class="section-title">Business</div>
            <div class="space-y-4">
                <div>
                    <label class="ios-label">Business Name</label>
                    <input type="text" id="in-biz-name" class="ios-input" value="TUALANG TANUR" oninput="updateReceipt()">
                </div>
                <div>
                    <label class="ios-label">Business Phone</label>
                    <input type="text" id="in-biz-phone" class="ios-input" value="+6285729317184" oninput="updateReceipt()">
                </div>
                <div>
                    <label class="ios-label">Business Website / IG</label>
                    <input type="text" id="in-biz-web" class="ios-input" value="Instagram: @tualang.tanur" oninput="updateReceipt()">
                </div>
                <div>
                    <label class="ios-label">Business Address</label>
                    <textarea id="in-biz-address" class="ios-input" rows="2" oninput="updateReceipt()">Jl. Kaliurang km. 10, Ngaglik, Sleman</textarea>
                </div>
            </div>

            <!-- Items Section -->
            <div class="section-title">Items</div>
            <div id="items-container" class="space-y-4">
                <!-- Item inputs will be injected here -->
            </div>
            <button onclick="addItem()" class="mt-4 w-full bg-blue-500 text-white font-semibold py-3 rounded-xl hover:bg-blue-600 transition">
                + Add Item
            </button>

            <!-- Other Data Section -->
            <div class="section-title">Other Data</div>
            <div class="space-y-4">
                <div>
                    <label class="ios-label">Footer Message</label>
                    <textarea id="in-footer" class="ios-input" rows="2" oninput="updateReceipt()">Thank you for your purchase ♥&#10;BCA 0375514741 A/N Syifana Rahma</textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- BAGIAN KANAN: Live Preview -->
    <div class="w-full md:w-1/2 lg:w-7/12 h-full bg-gray-200 flex flex-col items-center justify-center p-4 overflow-y-auto">
        <p class="text-gray-500 mb-4 font-medium hidden md:block">Live Preview</p>
        
        <!-- Kertas Struk -->
        <div id="print-area">
            <div class="receipt-paper">
                <div id="out-biz-name" class="title">TUALANG TANUR</div>
                
                <div class="center" style="line-height: 1.6; margin-bottom: 25px;">
                    <span id="out-biz-address">Jl. Kaliurang km. 10, Ngaglik, Sleman</span><br>
                    <span id="out-biz-phone">+6285729317184</span><br>
                    <span id="out-biz-web">Instagram: @tualang.tanur</span>
                </div>
                
                <div class="flex-between">
                    <div><span id="out-id">TNR00121</span> -<br>Customer</div>
                    <div style="text-align: right;"><span id="out-date">20 Aug 2026</span> <span id="out-time">7:32 pm</span></div>
                </div>

                <div class="divider"></div>

                <!-- Daftar Item Struk -->
                <div id="out-items-list">
                    <!-- Injected by JS -->
                </div>

                <!-- Total -->
                <div class="flex-between" style="font-size: 18px; font-weight: bold; margin-top: 5px;">
                    <div>Total</div>
                    <div id="out-total">IDR0</div>
                </div>

                <br><br>
                <div id="out-footer" class="center" style="white-space: pre-line; line-height: 1.5;">
                    Thank you for your purchase ♥
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Aplikasi -->
    <script>
        // State untuk menyimpan daftar item belanja
        let items = [
            { name: 'Pampis Cakalang 250gr (PS)', qty: 1, price: 49500 },
            { name: 'Ongkir', qty: 1, price: 15000 }
        ];

        // Format angka ke format mata uang (contoh: 49,500)
        function formatCurrency(amount) {
            return amount.toLocaleString('en-US');
        }

        // Render input field untuk setiap item di panel kiri
        function renderItemInputs() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-white p-4 rounded-xl border border-gray-200 relative shadow-sm';
                itemDiv.innerHTML = `
                    <button onclick="removeItem(${index})" class="absolute top-2 right-3 text-red-500 font-bold text-xl hover:text-red-700">&times;</button>
                    <div class="mb-3 pr-6">
                        <label class="ios-label">Item Name</label>
                        <input type="text" class="ios-input" value="${item.name}" oninput="updateItem(${index}, 'name', this.value)">
                    </div>
                    <div class="flex space-x-3">
                        <div class="w-1/3">
                            <label class="ios-label">Qty</label>
                            <input type="number" class="ios-input" value="${item.qty}" oninput="updateItem(${index}, 'qty', this.value)">
                        </div>
                        <div class="w-2/3">
                            <label class="ios-label">Price (IDR)</label>
                            <input type="number" class="ios-input" value="${item.price}" oninput="updateItem(${index}, 'price', this.value)">
                        </div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        // Update item di dalam state array
        function updateItem(index, field, value) {
            if (field === 'qty' || field === 'price') {
                items[index][field] = Number(value);
            } else {
                items[index][field] = value;
            }
            updateReceipt();
        }

        // Tambah item baru
        function addItem() {
            items.push({ name: 'New Item', qty: 1, price: 0 });
            renderItemInputs();
            updateReceipt();
        }

        // Hapus item
        function removeItem(index) {
            items.splice(index, 1);
            renderItemInputs();
            updateReceipt();
        }

        // Fungsi utama untuk mengupdate tampilan struk di panel kanan
        function updateReceipt() {
            // Update teks biasa
            document.getElementById('out-id').innerText = document.getElementById('in-id').value;
            document.getElementById('out-date').innerText = document.getElementById('in-date').value;
            document.getElementById('out-time').innerText = document.getElementById('in-time').value;
            document.getElementById('out-biz-name').innerText = document.getElementById('in-biz-name').value;
            document.getElementById('out-biz-phone').innerText = document.getElementById('in-biz-phone').value;
            document.getElementById('out-biz-web').innerText = document.getElementById('in-biz-web').value;
            document.getElementById('out-biz-address').innerText = document.getElementById('in-biz-address').value;
            document.getElementById('out-footer').innerText = document.getElementById('in-footer').value;

            // Render ulang daftar item di struk
            const outItemsList = document.getElementById('out-items-list');
            outItemsList.innerHTML = '';
            let total = 0;

            items.forEach(item => {
                const itemTotal = item.qty * item.price;
                total += itemTotal;

                const itemHtml = `
                    <div class="flex-between" style="margin-bottom: 5px;">
                        <div style="padding-right: 20px;">
                            ${item.name}<br>
                            <span style="color: #555;">${item.qty} x IDR${formatCurrency(item.price)}</span>
                        </div>
                        <div>IDR${formatCurrency(itemTotal)}</div>
                    </div>
                    <div class="divider"></div>
                `;
                outItemsList.innerHTML += itemHtml;
            });

            // Update Total Akhir
            document.getElementById('out-total').innerText = 'IDR' + formatCurrency(total);
        }

        // Inisialisasi awal saat halaman dimuat
        renderItemInputs();
        updateReceipt();
    </script>
</body>
</html>
