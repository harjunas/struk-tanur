<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Digital Tualang Tanur</title>
    <!-- Tambahkan library html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
        }
        /* Form Styling (Kiri) */
        .form-section {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-section h3 { margin-top: 0; color: #007aff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #8e8e93; margin-bottom: 5px; font-weight: 500; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        button.action-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button.action-btn:hover { background-color: #0056b3; }

        /* Receipt Styling (Kanan) */
        .receipt-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .struk-kertas {
            background-color: white;
            width: 340px;
            padding: 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #000;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
        }
        .center { text-align: center; }
        .flex { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .divider { border-bottom: 1px solid #000; margin: 15px 0; }
        .judul { font-size: 24px; font-weight: 900; letter-spacing: 1px; margin-bottom: 15px;}
        .bold { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Area Input Form -->
    <div class="form-section">
        <h3>Receipt Details</h3>
        <div class="form-group">
            <label>Receipt ID</label>
            <input type="text" id="in-id" value="TNR00121" oninput="updateStruk()">
        </div>
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="in-cust" value="Customer" oninput="updateStruk()">
        </div>
        <div class="form-group">
            <label>Harga Item (IDR)</label>
            <input type="number" id="in-harga" value="49500" oninput="updateStruk()">
        </div>
        <div class="form-group">
            <label>Ongkos Kirim (IDR)</label>
            <input type="number" id="in-ongkir" value="15000" oninput="updateStruk()">
        </div>
        
        <button class="action-btn" onclick="downloadImage()">⬇ Download Struk (PNG)</button>
    </div>

    <!-- Area Preview Struk -->
    <div class="receipt-section">
        <div class="struk-kertas" id="struk-preview">
            <div class="center judul">TUALANG TANUR</div>
            <div class="center">
                Jl. Kaliurang km. 10, Ngaglik,<br>Sleman<br>
                +6285729317184<br>
                Instagram: @tualang.tanur
            </div>
            
            <br>
            <div class="flex">
                <div><span id="out-id">TNR00121</span> -<br><span id="out-cust">Customer</span></div>
                <div id="out-date"></div>
            </div>

            <div class="divider"></div>

            <div class="flex">
                <div>Pampis Cakalang 250gr<br>(PS)<br>1 x IDR<span id="out-harga">49,500</span></div>
                <div>IDR<span id="out-harga-total">49,500</span></div>
            </div>

            <div class="divider"></div>

            <div class="flex">
                <div>Ongkir<br>1 x IDR<span id="out-ongkir">15,000</span></div>
                <div>IDR<span id="out-ongkir-total">15,000</span></div>
            </div>

            <div class="divider"></div>

            <div class="flex bold">
                <div style="font-size: 16px;">Total</div>
                <div style="font-size: 16px;">IDR<span id="out-grand-total">64,500</span></div>
            </div>

            <br><br>
            <div class="center">
                Thank you for your purchase &hearts;<br>
                BCA 0375514741 A/N Syifana Rahma
            </div>
        </div>
    </div>
</div>

<script>
    // Set format tanggal otomatis
    const now = new Date();
    const options = { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: 'numeric', hour12: true };
    document.getElementById('out-date').innerText = now.toLocaleString('en-GB', options).replace(',', '');

    // Fungsi update angka secara real-time
    function updateStruk() {
        const id = document.getElementById('in-id').value;
        const cust = document.getElementById('in-cust').value;
        const harga = parseInt(document.getElementById('in-harga').value) || 0;
        const ongkir = parseInt(document.getElementById('in-ongkir').value) || 0;
        const total = harga + ongkir;

        document.getElementById('out-id').innerText = id;
        document.getElementById('out-cust').innerText = cust;
        
        document.getElementById('out-harga').innerText = harga.toLocaleString('en-US');
        document.getElementById('out-harga-total').innerText = harga.toLocaleString('en-US');
        
        document.getElementById('out-ongkir').innerText = ongkir.toLocaleString('en-US');
        document.getElementById('out-ongkir-total').innerText = ongkir.toLocaleString('en-US');
        
        document.getElementById('out-grand-total').innerText = total.toLocaleString('en-US');
    }

    // Fungsi untuk men-download elemen HTML menjadi gambar PNG
    function downloadImage() {
        const struk = document.getElementById('struk-preview');
        // Setting scale ke 2 agar hasil gambarnya jernih (high resolution)
        html2canvas(struk, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Struk-' + document.getElementById('in-id').value + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
